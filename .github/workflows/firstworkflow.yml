# This is a basic workflow to help you get started with Actions

name: MyBaseWorkflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      cbox:
        description: run deployment to env 'dev_develop' on cube afterwards
        required: false
        type: boolean

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  printout_manual_input_job:
    runs-on: ubuntu-latest
    steps:
      - name : printout_input
        id: step_hundred
        run : echo "{{ inputs.cbox }}"
        if: ${{ github.event_name =='workflow_dispatch' }}
        

  build_job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: checkout
        id: step_checkout
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        id: printout_one
        run: echo Hello, from job 1, step_one!
        
      - name: Run a one-line script 2nd time
        id: printout_two
        run: echo Hello, from job 2, step_two!

      - name: Run a one-line script 3rd time
        id: printout_three
        run: echo Hello, from job 3, step_three!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        id: printout_four
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          tree
          
  job_two:
    runs-on: ubuntu-latest
    needs: build_job
    steps:
      - name: Run a one-line script 3rd time
        id: printout_job2
        run: echo Hello, from job 2, step_one

  job_three:
    runs-on: ubuntu-latest
    needs: job_two
    steps: 
      - name: Run a one-line script 3rd time
        id: printout_job3
        run: echo Hello, from job 3, step_one

  job_four:
    runs-on: ubuntu-latest
    needs: [build_job, job_three]
    steps: 
      - name: Run a one-line script 3rd time
        id: printout_job4
        run: echo Hello, from job 4, step_one
        
      - name: event_emitter
        id: eventEmitter
        uses: diekotto/repository-dispatch@v1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: octocat/example-repo
          event-type: deploy-to-dev-develop
          client-payload: |
            {
              "deployToDevDevelop": {{ inputs.cbox }},
              "deployed_by": "MyBaseWorkflow"
            }
          if: ${{ inputs.cbox =='true' }}
